        - "고객사 이름이 들어간 내부 보고서"
    right:
      title: 이렇게 바꿔서 입력
      items:
        - "A 고객(연락처 삭제) 불만 내용"
        - "번호 부분을 지운 서류 양식"
        - "실제 값 대신 예시 숫자"
        - "고객사 → '제조업 고객사 B'"
    note: "회사에서 허용한 도구·요금제인지, 입력이 학습에 쓰이지 않는지 먼저 확인하세요"

