# 책에 들어가는 설명 이미지 정의
# 글자를 고친 뒤 `python tools/build_diagrams.py` 를 실행하면 assets/ 의 PNG 가 다시 만들어집니다.
#
# layout 종류
#   flow    : 단계가 화살표로 이어지는 흐름 (steps)
#   cards   : 카드 여러 장 (cards, columns)
#   compare : 왼쪽(나쁜 예)과 오른쪽(좋은 예) 비교 (left, right)
#   matrix  : 2x2 판단표 (x_axis, y_axis, cells)
#   spectrum / triple / stack : 스펙트럼 · 관계 그래프 · 계층 (tools/build_diagrams.py 설명 참고)
# 제목에서 *강조* 로 감싼 부분은 그라데이션으로 강조됩니다. kicker 는 그림 위 작은 라벨입니다.
# 공통: file, title, subtitle(선택), note(선택, 아래 강조 띠)
# 카드·단계·칸·층에 ex: "예시" 를 넣으면 아래에 예시 상자가 붙습니다 (디자인 v3). compare 는 tone: neutral 로 VS 비교.
# 색 이름: blue, green, orange, purple, red, teal, gray

theme:
  book: AI 300% 활용법
  primary: indigo
  secondary: cyan

diagrams:
  # ---------- 장 대표 이미지 ----------
  - file: ch01-llm-flow.png
    kicker: CHAPTER 01 · AI 이해하기
    layout: flow
    title: AI는 이렇게 *답을 만듭니다*
    subtitle: 정답을 찾아오는 것이 아니라, 그럴듯한 다음 말을 이어 붙입니다
    steps:
      - { icon: "📥", title: 읽기, desc: "내 질문과\n이전 대화 전체", color: blue, ex: "\"보고서 요약해 줘\"" }
      - { icon: "🎲", title: 예측, desc: "다음에 올 말의\n확률 계산", color: purple, ex: "'이번' 다음엔\n'분기' 70%" }
      - { icon: "✍️", title: 고르기, desc: "가장 그럴듯한\n말 하나 선택", color: teal, ex: "'분기' 선택" }
      - { icon: "🔁", title: 반복, desc: "답이 끝날 때까지\n2~3단계 반복", color: orange, ex: "…매출은 12%…" }
      - { icon: "💬", title: 답 완성, desc: "자연스럽지만\n틀릴 수도 있는 답", color: green, ex: "숫자는 꼭\n원문 확인" }
    note: "그래서 ① 재료(프롬프트)를 충분히 주고 ② 결과를 검증해야 합니다"

  - file: ch02-five-elements.png
    kicker: CHAPTER 02 · 프롬프트 기본기
    layout: cards
    columns: 5
    title: 좋은 프롬프트의 *5요소*
    subtitle: 결과가 아쉬우면 빠진 요소를 하나씩 채워 보세요
    cards:
      - { icon: "🎭", title: 역할, desc: "누구의 관점으로?\n\n예) 10년 차\n인사 담당자", color: blue }
      - { icon: "🧭", title: 맥락, desc: "어떤 상황인가?\n\n예) 신입 50명,\n첫날 20분 발표", color: purple }
      - { icon: "🎯", title: 과제, desc: "무엇을 할까?\n\n예) 회사 소개\n발표 개요 작성", color: red }
      - { icon: "📐", title: 형식, desc: "어떤 모양으로?\n\n예) 슬라이드 5장,\n장마다 3줄", color: teal }
      - { icon: "🧩", title: 예시, desc: "견본이 있나?\n\n예) 슬라이드 1:\n우리가 하는 일", color: orange }
    note: "효과가 가장 큰 것은 '맥락' — 대상·목적·제약을 먼저 적으세요"

  - file: ch03-advanced.png
    kicker: CHAPTER 03 · 프롬프트 고급
    layout: cards
    columns: 3
    title: 프롬프트 *고급 기법* 6가지
    subtitle: 복잡한 일일수록 한 번에 시키지 말고 나누고, 보여 주고, 점검하게 합니다
    cards:
      - { icon: "🪜", title: 단계별로 생각하기, desc: "답 전에 풀이 과정을\n먼저 쓰게 하기", color: blue, ex: "\"계산 과정을 먼저 보여 줘\"" }
      - { icon: "🧩", title: 예시로 가르치기, desc: "원하는 결과의 견본을\n2~3개 보여 주기", color: purple, ex: "좋은 제목 예시 3개 제시" }
      - { icon: "📚", title: 긴 문서 다루기, desc: "자료는 위에, 질문은 아래\n필요한 부분 인용 먼저", color: teal, ex: "<문서1>…</문서1> 태그" }
      - { icon: "🔍", title: 스스로 검토하기, desc: "답을 다시 읽고\n틀린 곳 찾게 하기", color: orange, ex: "\"틀린 숫자 3곳 찾아 줘\"" }
      - { icon: "🔗", title: 단계 나눠 연결하기, desc: "조사 → 개요 → 초안 →\n다듬기를 따로 요청", color: green, ex: "개요 확인 후 본문" }
      - { icon: "🗂️", title: 구조화된 출력, desc: "표·JSON 등 정해진\n형식으로 받기", color: red, ex: "항목|담당|마감 표" }

  - file: ch04-recipe.png
    kicker: CHAPTER 04 · 업무별 프롬프트 레시피
    layout: flow
    title: 프롬프트 *레시피* 사용법
    subtitle: 복사 → 내 상황으로 채우기 → 실행 → 다듬기 → 저장
    steps:
      - { icon: "📋", title: 복사, desc: "업무에 맞는\n레시피 고르기", color: blue, ex: "04-1 까다로운\n이메일" }
      - { icon: "✏️", title: 채우기, desc: "빈칸(______)에\n내 상황 입력", color: purple, ex: "받는 사람:\n2년 거래 협력사" }
      - { icon: "▶️", title: 실행, desc: "AI에 붙여 넣고\n결과 받기", color: teal, ex: "초안 3문단" }
      - { icon: "🛠️", title: 다듬기, desc: "유지할 것·바꿀 것\n알려 주기", color: orange, ex: "\"둘째 문단만\n더 짧게\"" }
      - { icon: "💾", title: 저장, desc: "잘 된 프롬프트는\n내 레시피로 보관", color: green, ex: "내 레시피.txt" }
    note: "레시피 구성: 이럴 때 쓰세요 · 효과 비교 · 프롬프트 · 입력/결과 예시 · 팁 · 주의할 점"

  - file: ch05-tool-map.png
    kicker: CHAPTER 05 · AI 도구 지도
    layout: cards
    columns: 3
    title: AI 도구 지도 — *이름보다 유형*으로
    subtitle: 하고 싶은 일에서 출발해 도구 유형을 고르세요
    cards:
      - { icon: "💬", title: 대화형 AI, desc: "글쓰기·요약·분석\nChatGPT · Claude · Gemini", color: blue, ex: "메일 초안, 회의록 정리" }
      - { icon: "🔎", title: 검색·리서치 AI, desc: "최신 정보·사실 확인\nPerplexity · 딥 리서치", color: purple, ex: "\"최신 통계 출처 링크로\"" }
      - { icon: "📒", title: 문서·노트 AI, desc: "내 자료 안에서만 답함\nNotebookLM · 프로젝트", color: teal, ex: "보고서 PDF 5개 비교" }
      - { icon: "💻", title: 코딩 AI, desc: "스크립트·개발\nClaude Code · Cursor · Copilot", color: gray, ex: "엑셀 정리 파이썬" }
      - { icon: "🎨", title: 이미지·영상·음성, desc: "삽화·홍보물·받아쓰기\nMidjourney · Ideogram 등", color: orange, ex: "발표 표지 삽화" }
      - { icon: "⚙️", title: 업무 자동화, desc: "반복 작업 자동 실행\nZapier · Make · n8n", color: green, ex: "폼 응답 → 시트 → 알림" }
    note: "추천 순서: 대화형 → 검색형 → 문서형 → 자동화 (도구 이름은 자주 바뀝니다)"

  - file: ch06-workflow.png
    kicker: CHAPTER 06 · 도구 조합 워크플로
    layout: flow
    title: 도구를 *이어 쓰는* 워크플로
    subtitle: "예시: 시장 조사 보고서 만들기"
    steps:
      - { icon: "🔎", title: 찾기, desc: "검색형 AI로\n믿을 만한 자료 찾기", color: purple, ex: "공식 통계\n링크 5개" }
      - { icon: "📒", title: 분석, desc: "문서 AI에 원문을 넣고\n핵심·근거 정리", color: teal, ex: "핵심 수치\n+ 인용" }
      - { icon: "💬", title: 작성, desc: "대화형 AI로\n보고서 초안 작성", color: blue, ex: "A4 2쪽 초안" }
      - { icon: "🎨", title: 시각화, desc: "이미지 AI로\n표지·도식 만들기", color: orange, ex: "표지 삽화" }
      - { icon: "🙋", title: 확인, desc: "사람이 사실 확인\n후 최종 결정", color: red, ex: "수치 대조" }
    note: "각 단계의 결과물을 다음 단계의 입력으로 넘기는 것이 핵심입니다"

