    steps:
      - { icon: "🎯", title: 목표 받기, desc: "사람이 할 일과\n완료 조건 제시", color: blue, ex: "\"경쟁사 3곳\n가격 비교표\"" }
      - { icon: "🗺️", title: 계획, desc: "필요한 단계를\n스스로 나누기", color: purple, ex: "검색→정리\n→표 작성" }
      - { icon: "🧰", title: 도구 사용, desc: "검색·파일·앱 등\n도구 실행", color: teal, ex: "웹 검색\n파일 저장" }
      - { icon: "✅", title: 결과 확인, desc: "목표에 맞는지\n점검 후 다시 시도", color: orange, ex: "빠진 회사\n다시 검색" }
      - { icon: "📨", title: 보고, desc: "결과와 근거를\n사람에게 전달", color: green, ex: "표 + 출처 링크" }
    note: "중요한 실행(보내기·삭제·결제) 전에는 사람이 승인하도록 설정하세요"

