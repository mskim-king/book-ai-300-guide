# 「AI 300% 활용법」 구조 정의 — 이 파일을 고치고 python generate.py 실행
book:
  title: AI 300% 활용법
  subtitle: 프롬프트부터 업무 자동화까지
  author: 저자명
  audience: AI를 업무에 제대로 쓰고 싶은 직장인·입문자
  description: >
    대화형 AI의 원리, 프롬프트 작성법, 업무별 프롬프트 레시피,
    다양한 AI 도구의 조합과 자동화까지 실전 중심으로 정리합니다.
  review_days: 30      # 빠르게 변하는 분야라 30일마다 재확인
  retest_days: 60      # 프롬프트 레시피 재테스트 주기
  show_drafts: false   # true 로 바꾸면 '작성 중' 페이지도 위키독스 목차에 공개
series:
  name: AI 시대 데이터 실무 4부작
  books:   # 위키독스 공개 후 url 을 채우면 README 에 링크가 생깁니다
    - { title: "AI 300% 활용법", url: "" }
    - { title: "가명정보 A to Z", url: "https://wikidocs.net/book/22299" }
    - { title: "파이썬으로 시작하는 실전 퀀트 투자", url: "" }
    - { title: "LLM × 온톨로지", url: "" }

chapters:
  - id: "01"
    slug: understand
    title: AI 이해하기
    summary: 대화형 AI가 어떻게 동작하는지, 무엇을 잘하고 못하는지 알아봅니다.
    pages:
      - { slug: how-llm-works,  title: LLM은 어떻게 답을 만드는가, tags: [기초, LLM] }
      - { slug: can-cannot,     title: AI가 잘하는 일과 못하는 일, tags: [기초] }
      - { slug: hallucination,  title: 환각과 검증하는 습관, tags: [기초, 검증] }

  - id: "02"
    slug: prompt-basics
    title: 프롬프트 기본기
    summary: 좋은 결과를 얻는 프롬프트의 기본 구조를 익힙니다.
    pages:
      - { slug: five-elements,  title: "프롬프트 5요소: 역할·맥락·과제·형식·예시", tags: [프롬프트] }
      - { slug: be-specific,    title: 구체적으로 요청하는 법, tags: [프롬프트] }
      - { slug: iterate,        title: 대화로 결과 다듬기, tags: [프롬프트] }

  - id: "03"
    slug: prompt-advanced
    title: 프롬프트 고급
    summary: 복잡한 과제에서 정확도와 품질을 끌어올리는 기법입니다.
    pages:
      - { slug: step-by-step,   title: 단계별로 생각하게 하기, tags: [프롬프트, 고급] }
      - { slug: few-shot,       title: 예시로 가르치기, tags: [프롬프트, 고급] }
      - { slug: long-docs,      title: 긴 문서 다루기, tags: [프롬프트, 고급] }
      - { slug: self-review,    title: 스스로 검토하게 하기, tags: [프롬프트, 고급] }
      - { slug: chaining,       title: 단계를 나눠 연결하기, tags: [프롬프트, 고급] }
      - { slug: structured-out, title: 표·JSON 등 구조화된 출력 받기, tags: [프롬프트, 고급], see_also: ["LLM × 온톨로지 — 온톨로지로 LLM 강화"] }

  - id: "04"
    slug: recipes
    title: 업무별 프롬프트 레시피
    summary: 바로 복사해 쓸 수 있는 업무별 프롬프트 모음입니다.
    pages:
      - { slug: writing,     title: 보고서·이메일 쓰기, tags: [레시피, 글쓰기], template: recipe }
      - { slug: summary,     title: 문서·회의 요약, tags: [레시피, 요약], template: recipe }
      - { slug: planning,    title: 기획·아이디어 발상, tags: [레시피, 기획], template: recipe }
      - { slug: analysis,    title: 데이터 분석, tags: [레시피, 분석], template: recipe, see_also: ["파이썬으로 시작하는 실전 퀀트 투자 — AI 퀀트"] }
      - { slug: translation, title: 번역·교정, tags: [레시피, 번역], template: recipe }
      - { slug: coding,      title: 코딩·자동화 스크립트, tags: [레시피, 코딩], template: recipe }
      - { slug: learning,    title: 새 분야 빠르게 공부하기, tags: [레시피, 학습], template: recipe }

  - id: "05"
    slug: tools
    title: AI 도구 지도
    summary: 도구 이름보다 유형으로 이해하고, 목적에 맞게 고르는 법을 다룹니다.
    pages:
      - { slug: chat,       title: 대화형 AI, tags: [도구] }
      - { slug: research,   title: 검색·리서치 AI, tags: [도구, 리서치] }
      - { slug: docs-notes, title: 문서·노트 AI, tags: [도구, 문서] }
      - { slug: coding,     title: 코딩 AI, tags: [도구, 코딩] }
      - { slug: media,      title: 이미지·영상·음성 AI, tags: [도구, 멀티미디어] }
      - { slug: automation, title: 업무 자동화 도구, tags: [도구, 자동화] }
      - { slug: choose,     title: 목적별 도구 고르기, tags: [도구, 선택] }

  - id: "06"
    slug: workflows
    title: 도구 조합 워크플로
    summary: 여러 AI 도구를 이어 붙여 한 번에 결과를 내는 흐름입니다.
    pages:
      - { slug: research-to-publish, title: "리서치 → 정리 → 발행", tags: [워크플로] }
      - { slug: this-series,         title: "사례: 이 시리즈를 AI로 만든 과정", tags: [워크플로, 사례] }
      - { slug: meeting,             title: "회의 녹음 → 요약 → 할 일 정리", tags: [워크플로] }

  - id: "07"
    slug: agents
    title: AI 에이전트와 자동화
    summary: 스스로 여러 단계를 수행하는 에이전트와 반복 업무 자동화를 다룹니다.
    pages:
      - { slug: what-is-agent, title: AI 에이전트란, tags: [에이전트] }
      - { slug: mcp,           title: "MCP: AI와 도구를 잇는 표준", tags: [에이전트, MCP] }
      - { slug: automate,      title: 반복 업무 자동화 설계, tags: [에이전트, 자동화] }

  - id: "08"
    slug: safety
    title: 안전하게 쓰기
    summary: 개인정보·보안·저작권을 지키며 AI를 쓰는 법입니다.
    pages:
      - { slug: privacy,   title: 개인정보와 기밀 정보 지키기, tags: [안전, 개인정보], see_also: ["가명정보 A to Z — AI 시대의 가명정보"] }
      - { slug: copyright, title: 저작권과 출처 표기, tags: [안전, 저작권] }
      - { slug: verify,    title: 결과 검증 체크리스트, tags: [안전, 검증] }

  - id: "09"
    slug: trends
    title: 최신 동향
    summary: 매월 갱신하는 모델·기능·도구 변화 기록입니다.
    pages:
      - { slug: monthly,  title: 월간 업데이트 노트, tags: [동향] }
      - { slug: models,   title: 주요 모델 변화, tags: [동향, 모델] }

  - id: "10"
    slug: genre-tools
    title: 장르별 AI 도구와 활용 사례
    summary: 문서·발표·영상·음성·회의·번역 등 장르별 AI 도구의 특징과, 도구를 조합해 일하는 직무별 사례를 다룹니다.
    pages:
      - { slug: office,       title: "문서·오피스 AI (Copilot·Gemini·Notion AI)", tags: [도구, 오피스] }
      - { slug: presentation, title: "프레젠테이션·디자인 AI (Gamma·Canva 등)", tags: [도구, 발표] }
      - { slug: video,        title: "영상 생성·편집 AI", tags: [도구, 영상] }
      - { slug: audio,        title: "음성·음악 AI", tags: [도구, 음성] }
      - { slug: meeting,      title: "회의·받아쓰기 AI", tags: [도구, 회의] }
      - { slug: translation,  title: "번역 AI (DeepL·파파고·구글 번역)", tags: [도구, 번역] }
      - { slug: job-cases,    title: "직무별 AI 도구 조합 사례", tags: [사례, 워크플로] }

  - id: "90"
    slug: appendix
    title: 부록
    summary: 프롬프트 템플릿, 도구 비교표, 용어집을 모았습니다.
    pages:
      - { slug: prompt-templates, title: 프롬프트 템플릿 모음, tags: [부록] }
      - { slug: tool-table,       title: AI 도구 비교표, tags: [부록, 도구] }
      - { slug: glossary,         title: 용어집, tags: [부록] }
